[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geneweaver"
version = "0.1.0"
description = "GPU-Accelerated CRISPR Alignment Engine"
requires-python = ">=3.13"
dependencies = [
    "biopython==1.88",
    "numpy==2.5.4",
    "numba==0.68.1",
    "dask[distributed]==2026.8.0",
    "textual==8.2.8"
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
